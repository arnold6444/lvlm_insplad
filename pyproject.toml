[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insplad-benchmark"
version = "0.1.0"
description = "InsPLAD LVLM anomaly detection and structured explainability benchmark tooling"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "numpy>=1.26", "Pillow>=10"]
retrieval = ["numpy>=1.26", "Pillow>=10", "torch>=2.2", "transformers==5.14.0"]
hf = ["pandas>=2.0", "tqdm>=4.66", "accelerate>=1.0", "sentencepiece>=0.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
