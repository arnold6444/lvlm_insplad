name: Temporary fix evidence Colab cwd
on: [push]
permissions:
  contents: write
jobs:
  patch-and-verify:
    if: github.ref == 'refs/heads/fix/evidence-colab-cwd' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/evidence-colab-cwd
          fetch-depth: 0
      - name: Patch notebook
        run: echo '' | base64 -d | python
      - name: Install deps
        run: python -m pip install -q pytest numpy pillow
      - name: Verify
        run: |
          python -m pytest -q tests/test_evidence_ablation.py tests/test_reconpatch_lite.py tests/test_evidence_ablation_colab.py
          python -m py_compile src/insplad_benchmark/evidence_ablation.py src/insplad_benchmark/reconpatch_lite.py scripts/build_evidence_ablation.py scripts/run_reconpatch_lite_smoke.py scripts/run_hf_evidence_ablation.py
          python - <<'PY'
          import json
          from pathlib import Path
          nb=json.loads(Path('notebooks/lvlm_evidence_ablation_smoke_colab.ipynb').read_text())
          setup=next(c['source'] for c in nb['cells'] if c.get('cell_type')=='code' and 'focused_tests' in c.get('source','') and 'def run_cmd' in c.get('source',''))
          assert 'def run_cmd(cmd, log_name, *, cwd=None):' in setup
          assert 'cwd=REPO_DIR' in setup
          [compile(c.get('source',''), 'cell', 'exec') for c in nb['cells'] if c.get('cell_type')=='code']
          print('EVIDENCE_COLAB_CWD_OK')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add notebooks/lvlm_evidence_ablation_smoke_colab.ipynb
          git commit -m 'fix: run evidence Colab tests from repository root'
          git push origin HEAD:fix/evidence-colab-cwd
