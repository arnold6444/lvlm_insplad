name: Temporary fix resumable stage table

on:
  push:
    branches:
      - fix/resumable-stage-table-empty-error

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/resumable-stage-table-empty-error
          fetch-depth: 0

      - name: Patch status table and regression test
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          notebook_path = Path('notebooks/lvlm_vision_expert_smoke_resumable_colab.ipynb')
          notebook = json.loads(notebook_path.read_text(encoding='utf-8'))
          cell = next(
              cell for cell in notebook['cells']
              if cell.get('cell_type') == 'code'
              and 'def stage_table()' in ''.join(cell.get('source', []))
          )
          cell['source'] = '''# 2) 시작 시 현재 저장 상태 확인
          import pandas as pd

          def _safe_first_line(value, limit=160):
              if value is None:
                  return ""
              text = str(value)
              first_line = text.splitlines()[0] if text.splitlines() else ""
              return first_line[:limit]

          def stage_table():
              columns = [
                  "stage", "status", "reused", "updated_at_utc", "error",
              ]
              stages = STATE.get("stages", {})
              if not isinstance(stages, dict):
                  stages = {}

              rows = []
              for name, raw_value in sorted(
                  stages.items(), key=lambda item: str(item[0])
              ):
                  value = (
                      raw_value
                      if isinstance(raw_value, dict)
                      else {"status": "invalid_state", "error": raw_value}
                  )
                  rows.append({
                      "stage": str(name),
                      "status": value.get("status", ""),
                      "reused": value.get("reused", ""),
                      "updated_at_utc": value.get("updated_at_utc", ""),
                      "error": _safe_first_line(value.get("error", "")),
                  })
              return pd.DataFrame(rows, columns=columns)

          display(stage_table())
          print("상태 파일:", STATE_PATH)
          print("통합 로그:", RUN_LOG_PATH)
          '''.replace('          ', '').splitlines(keepends=True)

          for index, item in enumerate(notebook['cells']):
              if item.get('cell_type') == 'code':
                  source = ''.join(item.get('source', []))
                  compile(source, f'cell-{index}', 'exec')
          notebook_path.write_text(
              json.dumps(notebook, ensure_ascii=False, indent=1) + '\n',
              encoding='utf-8',
          )

          test_path = Path('tests/test_vision_expert_smoke_resumable_colab.py')
          test_source = test_path.read_text(encoding='utf-8')
          test_name = 'test_stage_table_handles_empty_none_multiline_and_malformed_values'
          if test_name not in test_source:
              test_source += f'''\n\ndef {test_name}() -> None:\n    root = Path(__file__).resolve().parents[1]\n    notebook_path = root / "notebooks" / "lvlm_vision_expert_smoke_resumable_colab.ipynb"\n    notebook = json.loads(notebook_path.read_text(encoding="utf-8"))\n    source = next(\n        "".join(cell.get("source", []))\n        for cell in notebook["cells"]\n        if cell.get("cell_type") == "code"\n        and "def stage_table()" in "".join(cell.get("source", []))\n    )\n    namespace = {{\n        "STATE": {{\n            "stages": {{\n                "complete": {{"status": "complete"}},\n                "empty": {{"status": "failed", "error": ""}},\n                "none": {{"status": "failed", "error": None}},\n                "multi": {{"status": "failed", "error": "first line\\nsecond line"}},\n                "malformed": "broken-state-value",\n            }}\n        }},\n        "STATE_PATH": Path("state.json"),\n        "RUN_LOG_PATH": Path("run.log"),\n        "display": lambda _value: None,\n    }}\n    exec(compile(source, "stage-table-cell", "exec"), namespace)\n    table = namespace["stage_table"]().set_index("stage")\n    assert table.loc["complete", "error"] == ""\n    assert table.loc["empty", "error"] == ""\n    assert table.loc["none", "error"] == ""\n    assert table.loc["multi", "error"] == "first line"\n    assert table.loc["malformed", "status"] == "invalid_state"\n    assert table.loc["malformed", "error"] == "broken-state-value"\n'''
              test_path.write_text(test_source, encoding='utf-8')
          PY

      - name: Install targeted test dependencies
        run: python -m pip install -q pytest pandas

      - name: Run targeted verification
        run: |
          python -m pytest -q tests/test_vision_expert_smoke_resumable_colab.py
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('notebooks/lvlm_vision_expert_smoke_resumable_colab.ipynb')
          notebook = json.loads(path.read_text(encoding='utf-8'))
          source = next(
              ''.join(cell.get('source', []))
              for cell in notebook['cells']
              if cell.get('cell_type') == 'code'
              and 'def stage_table()' in ''.join(cell.get('source', []))
          )
          assert 'splitlines()[0][:160]' not in source
          assert 'def _safe_first_line' in source
          print('STAGE_TABLE_RUNTIME_OK')
          PY

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            notebooks/lvlm_vision_expert_smoke_resumable_colab.ipynb \
            tests/test_vision_expert_smoke_resumable_colab.py
          git commit -m "fix: make resumable stage table tolerate empty errors"
          git push origin HEAD:fix/resumable-stage-table-empty-error
