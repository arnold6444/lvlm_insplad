name: Temporary materialize evidence ablation notebook

on:
  push:
    branches:
      - feat/evidence-ablation-smoke

permissions:
  contents: write

jobs:
  materialize-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/evidence-ablation-smoke
          fetch-depth: 0

      - name: Materialize notebook
        shell: bash
        run: |
          python - <<'PY'
          import base64, zlib
          from pathlib import Path
          payload = ''''''
          data = zlib.decompress(base64.b64decode(payload))
          path = Path('notebooks/lvlm_evidence_ablation_smoke_colab.ipynb')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(data)
          print(path, len(data))
          PY

      - name: Install targeted test dependencies
        run: |
          python -m pip install -q pytest numpy pillow
          python -m pip install -q --index-url https://download.pytorch.org/whl/cpu torch torchvision

      - name: Verify notebook and utilities
        run: |
          python -m pytest -q tests/test_evidence_ablation.py tests/test_reconpatch_lite.py tests/test_evidence_ablation_colab.py
          python -m py_compile src/insplad_benchmark/evidence_ablation.py src/insplad_benchmark/reconpatch_lite.py scripts/build_evidence_ablation.py scripts/run_reconpatch_lite_smoke.py scripts/run_hf_evidence_ablation.py
          python - <<'PY'
          import sys, tempfile
          from pathlib import Path
          from PIL import Image
          sys.path.insert(0, 'src')
          from insplad_benchmark.reconpatch_lite import WideResNetPatchExtractor, ReConPatchLiteConfig, ReConPatchLiteProjector, random_memory, nearest_memory_map
          with tempfile.TemporaryDirectory() as d:
              d=Path(d); paths=[]
              for i in range(2):
                  p=d/f'{i}.png'; Image.new('RGB',(64,64),(30+i*20,40,50)).save(p); paths.append(p)
              ext=WideResNetPatchExtractor(device='cpu', pretrained=False, image_size=64)
              patches,h,w=ext.extract_batch(paths)
              cfg=ReConPatchLiteConfig(embedding_dim=16, projection_dim=8, train_steps=2, batch_size=32, max_train_patches=64, memory_ratio=0.5)
              proj=ReConPatchLiteProjector(patches.shape[-1], cfg, device='cpu')
              flat=patches.reshape(-1,patches.shape[-1])[:64]
              proj.fit(flat)
              mem=random_memory(proj.transform(flat),0.5,42)
              q=proj.transform(patches[0])
              amap=nearest_memory_map(q,mem,h,w)
              assert amap.shape==(h,w)
              print('RECONPATCH_LITE_RUNTIME_OK', patches.shape, amap.shape)
          PY

      - name: Commit verified notebook
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/lvlm_evidence_ablation_smoke_colab.ipynb
          git commit -m "feat: add evidence ablation Colab notebook"
          git push origin HEAD:feat/evidence-ablation-smoke
