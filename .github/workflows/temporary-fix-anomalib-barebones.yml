name: Temporary fix anomalib barebones engine

on:
  push:
    branches:
      - fix/anomalib-barebones-engine

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/anomalib-barebones-engine
          fetch-depth: 0

      - name: Patch both anomalib Engine configurations
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          notebook_path = Path('notebooks/lvlm_vision_expert_smoke_colab.ipynb')
          data = json.loads(notebook_path.read_text(encoding='utf-8'))

          patchcore = next(
              cell for cell in data['cells']
              if cell.get('cell_type') == 'code'
              and '# 6) Vision expert A' in cell.get('source', '')
          )
          dinomaly = next(
              cell for cell in data['cells']
              if cell.get('cell_type') == 'code'
              and '# 7) Vision expert B' in cell.get('source', '')
          )

          patchcore_old = (
              "            logger=False, enable_checkpointing=False, limit_val_batches=0,\n"
              "            num_sanity_val_steps=0,\n"
          )
          patchcore_new = "            barebones=True,\n"
          if patchcore_old not in patchcore['source']:
              raise RuntimeError('PatchCore Engine configuration no longer matches expected source')
          patchcore['source'] = patchcore['source'].replace(patchcore_old, patchcore_new, 1)

          dinomaly_old = (
              "        deterministic=True, logger=False, enable_checkpointing=False,\n"
              "        limit_val_batches=0, num_sanity_val_steps=0,\n"
          )
          dinomaly_new = "        deterministic=True, barebones=True,\n"
          if dinomaly_old not in dinomaly['source']:
              raise RuntimeError('Dinomaly Engine configuration no longer matches expected source')
          dinomaly['source'] = dinomaly['source'].replace(dinomaly_old, dinomaly_new, 1)

          joined = '\n'.join(cell.get('source', '') for cell in data['cells'])
          assert 'enable_checkpointing=False' not in joined
          assert joined.count('barebones=True') == 2
          for index, cell in enumerate(data['cells']):
              if cell.get('cell_type') == 'code':
                  compile(cell.get('source', ''), f'cell-{index}', 'exec')

          notebook_path.write_text(
              json.dumps(data, ensure_ascii=False, indent=1) + '\n',
              encoding='utf-8',
          )

          test_path = Path('tests/test_vision_expert_smoke_colab.py')
          source = test_path.read_text(encoding='utf-8')
          test_name = 'test_anomalib_engines_use_barebones_without_checkpoint_conflict'
          if test_name not in source:
              source += f'''\n\ndef {test_name}() -> None:\n    root = Path(__file__).resolve().parents[1]\n    notebook = root / "notebooks" / "lvlm_vision_expert_smoke_colab.ipynb"\n    data = json.loads(notebook.read_text(encoding="utf-8"))\n    joined = "\\n".join(cell.get("source", "") for cell in data["cells"])\n    assert joined.count("barebones=True") == 2\n    assert "enable_checkpointing=False" not in joined\n'''
              test_path.write_text(source, encoding='utf-8')
          PY

      - name: Install exact runtime and test dependencies
        run: |
          python -m pip install -q pytest 'anomalib==2.6.0'

      - name: Verify notebook and exact anomalib runtime contract
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q tests/test_vision_expert_smoke_colab.py
          python - <<'PY'
          from anomalib.callbacks.checkpoint import ModelCheckpoint
          from anomalib.engine import Engine
          from lightning.pytorch import Trainer

          engine = Engine(
              accelerator='cpu',
              devices=1,
              max_epochs=1,
              barebones=True,
          )
          engine._setup_anomalib_callbacks()
          assert not any(
              isinstance(callback, ModelCheckpoint)
              for callback in engine._cache.args['callbacks']
          )
          trainer = Trainer(**engine._cache.args)
          assert trainer.enable_checkpointing is False
          print('anomalib 2.6.0 barebones Trainer initialization passed')
          PY

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/lvlm_vision_expert_smoke_colab.ipynb tests/test_vision_expert_smoke_colab.py
          git commit -m "fix: use anomalib barebones engines in Colab"
          git push origin HEAD:fix/anomalib-barebones-engine
