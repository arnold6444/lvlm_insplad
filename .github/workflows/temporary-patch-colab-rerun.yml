name: Temporary patch Colab rerun safety

on:
  push:
    branches:
      - fix/colab-rerun-working-directory

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/colab-rerun-working-directory
          fetch-depth: 0

      - name: Patch notebook and regression test
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          notebook_path = Path('notebooks/lvlm_vision_expert_smoke_colab.ipynb')
          data = json.loads(notebook_path.read_text(encoding='utf-8'))
          target = "REPO_DIR = Path('/content/lvlm_insplad')"
          replacement = (
              "# The previous run finishes inside REPO_DIR. Move out before deleting it, "
              "so rerunning this cell is safe.\n"
              "os.chdir('/content')\n"
              + target
          )
          matches = [cell for cell in data['cells'] if target in cell.get('source', '')]
          if len(matches) != 1:
              raise RuntimeError(f'expected exactly one checkout cell, found {len(matches)}')
          source = matches[0]['source']
          if "os.chdir('/content')\n" not in source.split(target, 1)[0][-300:]:
              matches[0]['source'] = source.replace(target, replacement, 1)
          source = matches[0]['source']
          assert source.index("os.chdir('/content')") < source.index(target)
          assert source.index(target) < source.index('shutil.rmtree(REPO_DIR)')
          notebook_path.write_text(
              json.dumps(data, ensure_ascii=False, indent=1) + '\n',
              encoding='utf-8',
          )

          test_path = Path('tests/test_vision_expert_smoke_colab.py')
          test_source = test_path.read_text(encoding='utf-8')
          test_name = 'test_checkout_cell_is_safe_when_rerun_from_deleted_repo_directory'
          if test_name not in test_source:
              test_source += f'''\n\ndef {test_name}() -> None:\n    root = Path(__file__).resolve().parents[1]\n    notebook = root / "notebooks" / "lvlm_vision_expert_smoke_colab.ipynb"\n    data = json.loads(notebook.read_text(encoding="utf-8"))\n    checkout_source = next(\n        cell["source"]\n        for cell in data["cells"]\n        if cell.get("cell_type") == "code"\n        and "REPO_DIR = Path('/content/lvlm_insplad')" in cell.get("source", "")\n    )\n    chdir_index = checkout_source.index("os.chdir('/content')")\n    repo_index = checkout_source.index("REPO_DIR = Path('/content/lvlm_insplad')")\n    delete_index = checkout_source.index("shutil.rmtree(REPO_DIR)")\n    assert chdir_index < repo_index < delete_index\n'''
              test_path.write_text(test_source, encoding='utf-8')
          PY

      - name: Install test dependency
        run: python -m pip install -q pytest

      - name: Run focused notebook tests
        run: python -m pytest -q tests/test_vision_expert_smoke_colab.py

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- notebooks/lvlm_vision_expert_smoke_colab.ipynb tests/test_vision_expert_smoke_colab.py; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/lvlm_vision_expert_smoke_colab.ipynb tests/test_vision_expert_smoke_colab.py
          git commit -m "fix: make Colab checkout cell rerunnable"
          git push origin HEAD:fix/colab-rerun-working-directory
