name: Temporary materialize resumable vision smoke notebook

on:
  push:
    branches:
      - feat/resumable-vision-smoke-notebook-v2

permissions:
  contents: write

jobs:
  materialize-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/resumable-vision-smoke-notebook-v2
          fetch-depth: 0

      - name: Materialize notebook and test from verified bundle
        shell: bash
        run: |
          cat .tmp/resumable_notebook_v2/part*.b64 | base64 --decode > /tmp/resumable_notebook_bundle.tar.gz
          tar -xzf /tmp/resumable_notebook_bundle.tar.gz -C .
          echo '93fde789d294728568fc1946f62c69ab5f711441722660d0015dfb99872ac194  notebooks/lvlm_vision_expert_smoke_resumable_colab.ipynb' | sha256sum -c -
          echo '669fd2c97f7b1e995d6206401a07d10c9c2dda733eb6d932af0a2115a453f8be  tests/test_vision_expert_smoke_resumable_colab.py' | sha256sum -c -

      - name: Verify notebook structure and regression contract
        shell: bash
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_vision_expert_smoke_resumable_colab.py
          python - <<'PY'
          import json
          from pathlib import Path

          notebook = Path('notebooks/lvlm_vision_expert_smoke_resumable_colab.ipynb')
          data = json.loads(notebook.read_text(encoding='utf-8'))
          for index, cell in enumerate(data['cells']):
              if cell.get('cell_type') == 'code':
                  compile(''.join(cell.get('source', [])), f'cell-{index}', 'exec')
          assert len(data['cells']) == 14
          assert any(
              '# 11) 결과 확인용 ZIP 생성' in ''.join(cell.get('source', []))
              for cell in data['cells']
          )
          print('NOTEBOOK_COMPILE_OK cells=14')
          PY

      - name: Run review ZIP export cell with synthetic Drive results
        shell: bash
        run: |
          sudo mkdir -p /content/drive/MyDrive/lvlm_insplad_results/vision_expert_smoke_v1/logs
          sudo mkdir -p /content/drive/MyDrive/lvlm_insplad_results/vision_expert_smoke_v1/roi_smoke_50
          sudo mkdir -p /content/drive/MyDrive/lvlm_insplad_results/vision_expert_smoke_v1/retrieved_reference_smoke_50
          sudo chown -R "$USER":"$USER" /content
          printf 'model_key,f1\nqwen,0.7\n' > /content/drive/MyDrive/lvlm_insplad_results/vision_expert_smoke_v1/screening_comparison.csv
          printf '{"stages": {}}\n' > /content/drive/MyDrive/lvlm_insplad_results/vision_expert_smoke_v1/run_state.json
          printf '{"expert":"patchcore"}\n' > /content/drive/MyDrive/lvlm_insplad_results/vision_expert_smoke_v1/smoke_winner.json
          printf 'model_key,f1\nqwen,0.6\n' > /content/drive/MyDrive/lvlm_insplad_results/vision_expert_smoke_v1/roi_smoke_50/leaderboard.csv
          printf 'model_key,one_shot_plus_f1\nqwen,0.5\n' > /content/drive/MyDrive/lvlm_insplad_results/vision_expert_smoke_v1/retrieved_reference_smoke_50/leaderboard.csv
          printf 'synthetic log\n' > /content/drive/MyDrive/lvlm_insplad_results/vision_expert_smoke_v1/logs/run.log
          python - <<'PY'
          import json
          import sys
          import types
          import zipfile
          from pathlib import Path

          google = types.ModuleType('google')
          colab = types.ModuleType('google.colab')
          class Drive:
              @staticmethod
              def mount(*args, **kwargs):
                  raise AssertionError('Drive was already mounted for the runtime test')
          class Files:
              @staticmethod
              def download(path):
                  raise AssertionError('Auto-download must be disabled in the runtime test')
          colab.drive = Drive
          colab.files = Files
          google.colab = colab
          sys.modules['google'] = google
          sys.modules['google.colab'] = colab

          data = json.loads(Path('notebooks/lvlm_vision_expert_smoke_resumable_colab.ipynb').read_text(encoding='utf-8'))
          source = next(
              ''.join(cell.get('source', []))
              for cell in data['cells']
              if '# 11) 결과 확인용 ZIP 생성' in ''.join(cell.get('source', []))
          )
          namespace = {
              'RUN_FOLDER': 'vision_expert_smoke_v1',
              'SMOKE_SIZE': 50,
              'AUTO_DOWNLOAD_REVIEW_ZIP': False,
          }
          exec(compile(source, 'review-export-cell', 'exec'), namespace)
          latest = Path('/content/drive/MyDrive/vision_expert_smoke_REVIEW_LATEST.zip')
          assert latest.is_file() and latest.stat().st_size > 0
          with zipfile.ZipFile(latest) as archive:
              names = set(archive.namelist())
          for expected in (
              'review_manifest.json',
              'screening_comparison.csv',
              'run_state.json',
              'smoke_winner.json',
              'logs/run_log_tail.txt',
          ):
              assert expected in names
          print(f'REVIEW_EXPORT_RUNTIME_OK bytes={latest.stat().st_size}')
          PY

      - name: Commit verified notebook
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/lvlm_vision_expert_smoke_resumable_colab.ipynb tests/test_vision_expert_smoke_resumable_colab.py
          git commit -m "feat: add resumable vision-expert Colab notebook"
          git push origin HEAD:feat/resumable-vision-smoke-notebook-v2
