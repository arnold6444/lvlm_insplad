name: Temporary AgentIAD-lite dev150 verify

on:
  push:
    branches:
      - feat/agent-iad-lite-dev150

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/agent-iad-lite-dev150
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install targeted dependencies
        run: python -m pip install -q -e '.[dev]'
      - name: Verify expanded dev flow
        shell: bash
        run: |
          python -m pytest -q tests/test_agent_iad_lite.py tests/test_agent_iad_lite_runner.py tests/test_agent_iad_lite_dev.py
          python -m py_compile scripts/build_vision_expert_dev_data.py scripts/run_patchcore_cohort.py scripts/run_agent_iad_lite_ref_first.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('notebooks/lvlm_agent_iad_lite_dev150_colab.ipynb')
          nb = json.loads(p.read_text(encoding='utf-8'))
          for i, cell in enumerate(nb['cells']):
              if cell.get('cell_type') == 'code':
                  compile(cell.get('source', ''), f'cell-{i}', 'exec')
          text = p.read_text(encoding='utf-8')
          assert 'DEV_SIZE = 150' in text
          assert 'run_agent_iad_lite_ref_first.py' in text
          assert 'tests/test_agent_iad_lite_dev.py' in text
          print('AGENT_DEV150_NOTEBOOK_COMPILE_OK', len(nb['cells']))
          PY
