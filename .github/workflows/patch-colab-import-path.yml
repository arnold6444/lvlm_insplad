name: Patch Colab package import path

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-colab-import-path.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch notebook and static test
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          notebook_path = Path('notebooks/lvlm_vision_expert_smoke_colab.ipynb')
          notebook = json.loads(notebook_path.read_text(encoding='utf-8'))

          marker = (
              "subprocess.run([sys.executable, '-m', 'pip', 'install', '-q', '-e', "
              "f'{REPO_DIR}[dev]'], check=True)\n"
              "os.chdir(REPO_DIR)"
          )
          replacement = (
              "subprocess.run([sys.executable, '-m', 'pip', 'install', '-q', '-e', "
              "f'{REPO_DIR}[dev]'], check=True)\n"
              "\n"
              "# Editable installs add a .pth file that the already-running Colab kernel may not reload.\n"
              "# Register src explicitly so imports work immediately without restarting the runtime.\n"
              "SRC_DIR = str(REPO_DIR / 'src')\n"
              "if SRC_DIR not in sys.path:\n"
              "    sys.path.insert(0, SRC_DIR)\n"
              "import importlib\n"
              "importlib.invalidate_caches()\n"
              "import insplad_benchmark\n"
              "print('package:', Path(insplad_benchmark.__file__).resolve())\n"
              "\n"
              "os.chdir(REPO_DIR)"
          )

          patched = False
          for cell in notebook['cells']:
              if cell.get('cell_type') != 'code':
                  continue
              source = cell.get('source', '')
              if "SRC_DIR = str(REPO_DIR / 'src')" in source:
                  patched = True
                  break
              if marker in source:
                  cell['source'] = source.replace(marker, replacement, 1)
                  patched = True
                  break
          if not patched:
              raise RuntimeError('setup-cell insertion marker not found')

          joined = '\n'.join(cell.get('source', '') for cell in notebook['cells'])
          required = (
              "SRC_DIR = str(REPO_DIR / 'src')",
              "sys.path.insert(0, SRC_DIR)",
              "import insplad_benchmark",
              "Path(insplad_benchmark.__file__).resolve()",
          )
          for token in required:
              if token not in joined:
                  raise RuntimeError(f'missing import-path patch token: {token}')
          for index, cell in enumerate(notebook['cells']):
              if cell.get('cell_type') == 'code':
                  compile(cell.get('source', ''), f'vision_expert_cell_{index}', 'exec')

          notebook_path.write_text(
              json.dumps(notebook, ensure_ascii=False, indent=1) + '\n',
              encoding='utf-8',
          )

          test_path = Path('tests/test_vision_expert_smoke_colab.py')
          test_source = test_path.read_text(encoding='utf-8')
          expected_marker = '        "SMOKE_SIZE = 50",\n'
          expected_line = '        "SRC_DIR = str(REPO_DIR / \'src\')",\n'
          if expected_line not in test_source:
              if expected_marker not in test_source:
                  raise RuntimeError('static-test insertion marker missing')
              test_source = test_source.replace(
                  expected_marker,
                  expected_marker + expected_line,
                  1,
              )
          test_path.write_text(test_source, encoding='utf-8')
          PY

      - name: Run focused tests
        run: |
          python -m pip install -q pytest numpy pillow
          PYTHONPATH=src python -m pytest -q \
            tests/test_vision_expert.py \
            tests/test_hf_vision_expert_smoke_runner.py \
            tests/test_vision_expert_smoke_colab.py

      - name: Commit verified fix and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm .github/workflows/patch-colab-import-path.yml
          git add notebooks/lvlm_vision_expert_smoke_colab.ipynb \
                  tests/test_vision_expert_smoke_colab.py \
                  .github/workflows/patch-colab-import-path.yml
          git commit -m "fix: register src path in Colab kernel"
          git push origin HEAD:main
